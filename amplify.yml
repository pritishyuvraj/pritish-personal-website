version: 1
# The website is static and does not use the template's Amplify backend.
# Publishing frontend assets leaves existing cloud backend resources unchanged.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
